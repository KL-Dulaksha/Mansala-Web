<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff &amp; Coordinator Portal Login — මංසල Mansala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4.5">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--clr-primary-dark);
      background-image: radial-gradient(circle at 50% 20%, rgba(255, 148, 24, 0.08), transparent 70%);
      padding: var(--sp-6) var(--sp-4);
      box-sizing: border-box;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
    }

    .auth-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: var(--sp-8);
      box-sizing: border-box;
    }

    .auth-logo-header {
      text-align: center;
      margin-bottom: var(--sp-6);
    }

    .auth-logo-header .site-logo-img {
      width: 74px;
      height: auto;
      max-height: 60px;
      object-fit: contain;
      margin: 0 auto var(--sp-3);
      display: block;
    }

    .auth-logo-header h1 {
      font-size: var(--fs-xl);
      color: var(--clr-text);
      margin-bottom: var(--sp-1);
    }

    .auth-logo-header p {
      font-size: var(--fs-xs);
      color: var(--clr-text-light);
      margin: 0;
    }

    .auth-notice {
      background: #E3F2FD;
      border: 1px solid #BBDEFB;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: var(--sp-5);
      font-size: var(--fs-xs);
      color: #0D47A1;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .auth-notice-icon {
      font-weight: var(--fw-bold);
      font-size: 14px;
      line-height: 1;
      padding-top: 1px;
    }

    .auth-error-banner {
      background: #FFEBEE;
      border: 1px solid #FFCDD2;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: var(--sp-5);
      font-size: var(--fs-xs);
      color: #C62828;
      display: none;
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--sp-6);
    }

    .auth-footer a {
      color: rgba(255, 255, 255, 0.75);
      font-size: var(--fs-xs);
      text-decoration: none;
      transition: color var(--duration) var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .auth-footer a:hover {
      color: var(--clr-accent);
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo-header">
        <img src="assets/images/logo-light.png" alt="මංසල Logo" class="site-logo-img">
        <h1>මංසල <span style="color: var(--clr-accent);">Staff</span> Portal</h1>
        <p>Students' Union &bull; Faculty of Science &bull; University of Ruhuna</p>
      </div>

      <!-- Error Alert -->
      <div id="auth-error" class="auth-error-banner" role="alert"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group mb-4">
          <label for="login-email" class="form-label">University Username or Email</label>
          <input 
            type="text" 
            id="login-email" 
            class="form-input" 
            placeholder="Enter university username or email" 
            required 
            autocomplete="username"
          >
          <div style="font-size: 11px; color: var(--clr-text-light); margin-top: 4px;">Coordinator accounts are provisioned by the Lead Administrator.</div>
        </div>

        <div class="form-group mb-4">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
            <span style="font-size: 11px; color: var(--clr-text-light);">Restricted Access</span>
          </div>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          >
        </div>

        <div class="form-group mb-6" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); color: var(--clr-text-mid); cursor: pointer;">
            <input type="checkbox" id="login-remember" checked> Keep me logged in on this browser
          </label>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn--primary" style="width: 100%; justify-content: center; padding: 12px;">
          Sign In to Dashboard <svg class="lucide lucide-arrow-right icon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="index.html">
        <svg class="lucide lucide-arrow-left" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        Return to Public Website (Home)
      </a>
    </div>
  </div>

  <script src="js/dashboard-db.js"></script>
  <script>
    

    document.addEventListener('DOMContentLoaded', () => {
      // Check query parameters (e.g. ?auth=required)
      const urlParams = new URLSearchParams(window.location.search);
      const errBox = document.getElementById('auth-error');
      if (urlParams.get('auth') === 'required') {
        errBox.textContent = 'Authentication required. Please sign in with your authorised account to access the dashboard.';
        errBox.style.display = 'block';
      }

      // Check if already authenticated
      const existingUser = MansalaAuth.getCurrentUser();
      if (existingUser) {
        if (existingUser.role === 'admin') {
          window.location.replace('admin-dashboard.html');
          return;
        } else if (existingUser.role === 'coordinator') {
          window.location.replace('coordinator-dashboard.html');
          return;
        }
      }

      // Handle submission
      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        errBox.textContent = '';

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;

        if (!email || !password) {
          errBox.textContent = 'Please enter both your university username or email and password.';
          errBox.style.display = 'block';
          return;
        }

        const submitBtn = document.getElementById('login-submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying credentials...';

        setTimeout(() => {
          const result = MansalaAuth.login(email, password, remember);
          if (result.success) {
            const redirectTarget = sessionStorage.getItem('mansala_redirect_after_login');
            sessionStorage.removeItem('mansala_redirect_after_login');

            if (result.user.role === 'admin') {
              window.location.href = (redirectTarget && redirectTarget.includes('admin')) ? redirectTarget : 'admin-dashboard.html';
            } else {
              window.location.href = (redirectTarget && redirectTarget.includes('coordinator')) ? redirectTarget : 'coordinator-dashboard.html';
            }
          } else {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In to Dashboard →';
            errBox.textContent = result.message || 'Login failed. Please verify your credentials.';
            errBox.style.display = 'block';
          }
        }, 300);
      });
    });
  </script>
  <!-- Official Lucide Icons Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>if(typeof lucide==='undefined'){document.write('<script src="js/lucide.js"><\/script>');}</script>
  <script>document.addEventListener('DOMContentLoaded',function(){if(typeof lucide!=='undefined'&&lucide.createIcons){lucide.createIcons();}});</script>
</body>
</html>
